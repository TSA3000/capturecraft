name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libxkbcommon-dev libgbm-dev

jobs:
  release:
    name: release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          NAME="capturecraft-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$NAME"
          BIN="target/${{ matrix.target }}/release"
          cp README.md LICENSE "$NAME/" 2>/dev/null || cp README.md "$NAME/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$BIN/capturecraft.exe" "$BIN/capturecraft-tray.exe" \
               "$BIN/capturecraft-app.exe" "$BIN/capturecraft-editor.exe" "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
            echo "STAGE=$NAME" >> "$GITHUB_ENV"
          else
            cp "$BIN/capturecraft" "$BIN/capturecraft-tray" \
               "$BIN/capturecraft-app" "$BIN/capturecraft-editor" "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      # Windows installers: an NSIS .exe and a WiX .msi, for x64 and ARM64.
      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $arch = if ("${{ matrix.target }}" -like 'aarch64*') { 'arm64' } else { 'x64' }
          # Absolute paths: NSIS resolves relative ones against the .nsi file.
          $stage = (Resolve-Path "${env:STAGE}").Path
          $out = (Get-Location).Path
          Get-ChildItem $stage | Select-Object Name

          # NSIS: the runner's own install if it has one, else Chocolatey (with
          # retries: its feed has outages, 503s), else the release zip.
          $env:PATH = "$env:PATH;${env:ProgramFiles(x86)}\NSIS;${env:ProgramFiles}\NSIS"
          for ($i = 1; $i -le 3 -and -not (Get-Command makensis -ErrorAction SilentlyContinue); $i++) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds (20 * $i) }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            Invoke-WebRequest -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' `
              -OutFile $zip -UserAgent 'curl' -MaximumRetryCount 3 -RetryIntervalSec 10
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $env:PATH = "$env:PATH;$(Join-Path $env:RUNNER_TEMP 'nsis-3.11')"
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw "NSIS is not available" }
          makensis /DVERSION=$version /DARCH=$arch /DSOURCE=$stage /DOUTDIR=$out `
            packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          echo "SETUP=capturecraft-$version-$arch-setup.exe" >> $env:GITHUB_ENV

          # WiX 6 as a dotnet tool, so the same step works on ARM64 runners.
          dotnet tool install --global wix --version 6.*
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          wix build packaging\windows\capturecraft.wxs `
            -arch $arch `
            -d Version=$version -d Source=$stage `
            -o "$out\capturecraft-$version-$arch.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix failed" }
          echo "MSI=capturecraft-$version-$arch.msi" >> $env:GITHUB_ENV

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.ASSET }}
            ${{ env.SETUP }}
            ${{ env.MSI }}
          fail_on_unmatched_files: false

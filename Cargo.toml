[package]
name = "capturecraft"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "CaptureCraft: open-source screen capture and annotation tool in pure Rust"
repository = "https://github.com/TSA3000/capturecraft"

[dependencies]
anyhow = "1"
arboard = "3.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
global-hotkey = "0.8"
softbuffer = "0.4.8"
winit = "0.30.13"
xcap = "0.9.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

# KSNI (D-Bus StatusNotifierItem) on Linux: no GTK needed.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

# Keep debug builds responsive (image scaling runs per resize)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

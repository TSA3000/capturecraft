[package]
name = "capturecraft"
version = "0.20.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "CaptureCraft: open-source screen capture and annotation tool in pure Rust"
repository = "https://github.com/TSA3000/capturecraft"
default-run = "capturecraft"

[dependencies]
anyhow = "1"
arboard = "3.7"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
# Geometry primitives from PhotoCraft (storytold/photocraft), the sibling
# craft app; keeps the editor's coordinate model identical to theirs.
photocraft-geom = { workspace = true }
# Same UI stack as storytold/photocraft (egui). 0.33 keeps MSRV at 1.89.
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4.8"
toml = "1"
winit = "0.30.13"
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

# KSNI (D-Bus StatusNotifierItem) on Linux: no GTK needed.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

# The app (this package) plus the layered crates of the CaptureCraft
# architecture; the layer table lives in xtask/src/layers.rs
# (`cargo xtask layers`).
[workspace]
resolver = "3"
members = [".", "crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TSA3000/capturecraft"

[workspace.dependencies]
capturecraft-format = { path = "crates/format" }
capturecraft-engine = { path = "crates/engine" }
# Without default features: only the UI turns on the wgpu backend.
capturecraft-compositor = { path = "crates/compositor", default-features = false }
capturecraft-capture = { path = "crates/capture" }
capturecraft-ocr = { path = "crates/ocr" }
capturecraft-ui-egui = { path = "crates/ui-egui" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-color = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-algo = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-doc = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-vector = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-text = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
photocraft-cms = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
# PNG/JPEG/WebP encoders of the app's Share / Export.
photocraft-codecs = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
# Multi-page PDF export (one capture per page).
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
# Theme tokens (`theme::Tokens`) shared with PhotoCraft's editor.
photocraft-ui-egui = { git = "https://github.com/storytold/photocraft", tag = "v0.9.0" }
# The UI stack of photocraft v0.9.0; the compositor's wgpu is the major
# version egui-wgpu 0.36 is built on, so the app's device is shared.
egui = { version = "0.36.2", default-features = false }
eframe = { version = "0.36.2", default-features = false }
wgpu = "30"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Keep debug builds responsive (image scaling runs per resize)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

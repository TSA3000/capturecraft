[package]
name = "capturecraft"
version = "0.10.3"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "CaptureCraft: open-source screen capture and annotation tool in pure Rust"
repository = "https://github.com/TSA3000/capturecraft"
default-run = "capturecraft"

[dependencies]
anyhow = "1"
arboard = "3.7"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
# Same UI stack as storytold/photocraft (egui). 0.33 keeps MSRV at 1.89.
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4.8"
toml = "1"
winit = "0.30.13"
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

# KSNI (D-Bus StatusNotifierItem) on Linux: no GTK needed.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

# Keep debug builds responsive (image scaling runs per resize)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

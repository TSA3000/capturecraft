[package]
name = "capturecraft-engine"
version.workspace = true
description = "CaptureCraft session and command registry: every tool action is a command (UI, CLI, JSON channel, MCP)"
edition.workspace = true
# photocraft-raster and photocraft-color declare 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

[dependencies]
capturecraft-format = { workspace = true }
# CPU only: the engine never enables the `gpu` feature.
capturecraft-compositor = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
# The Pen tool thins its trace with PhotoCraft's RDP simplify.
photocraft-algo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

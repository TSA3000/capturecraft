[package]
name = "capturecraft-compositor"
version = "0.1.0"
description = "CaptureCraft compositor: tile-parallel CPU reference oracle and wgpu compositor (pixel parity) for annotation scenes"
edition.workspace = true
# photocraft-raster, -doc and -vector declare 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

[features]
default = ["gpu"]
# The wgpu compositor. Without it only the CPU oracle is built (headless
# exports, CI, the CLI).
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
photocraft-geom = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-vector = { workspace = true }
# Shadow convolution, feather distance fields, raster warps and the CPU
# backdrop blur and mosaic (FilterParams kernels).
photocraft-algo = { workspace = true }
# Colour mode of the photocraft-algo filter context.
photocraft-color = { workspace = true }
# Shaping, wrapping and glyph outlines of callout text and badge labels.
photocraft-text = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
# Same major version as eframe 0.36's egui-wgpu, so the app's device can be
# shared with the editor canvas.
wgpu = { workspace = true, optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
# Blocks on adapter/device requests and buffer maps in the headless path.
pollster = { version = "0.4", optional = true }

[dev-dependencies]
# Expected bytes of the colour-encoding test (sRGB transfer curve).
photocraft-cms = { workspace = true }

[[test]]
name = "parity_tests"
required-features = ["gpu"]

[[test]]
name = "color_encoding"
required-features = ["gpu"]

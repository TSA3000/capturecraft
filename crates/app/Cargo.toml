[package]
name = "capturecraft-app"
version = "0.1.0"
description = "CaptureCraft desktop app on eframe + wgpu: hosts the editor, the floating capture HUD and the crosshair overlay"
edition.workspace = true
# The layered crates declare 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

# The editor the root package's tray and capture window open (and the
# installers ship). The tray, global hotkey and autostart stay in the root
# package for now.
[[bin]]
name = "capturecraft-editor"
path = "src/main.rs"

[dependencies]
capturecraft-format = { workspace = true }
capturecraft-engine = { workspace = true }
capturecraft-capture = { workspace = true }
# The UI analyzer behind Smart Move, Simplify and the Selection tool's Auto Fill.
capturecraft-ocr = { workspace = true }
capturecraft-ui-egui = { workspace = true }
photocraft-geom = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
photocraft-codecs = { workspace = true }
pdfcraft-create = { workspace = true }
pdfcraft-cos = { workspace = true }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Copy All (the root package uses the same version).
arboard = "3.7"
base64 = "0.22"
serde_json = { workspace = true }

[package]
name = "capturecraft-ui-egui"
version.workspace = true
description = "CaptureCraft egui shell: capture HUD, crosshair overlay and the five-zone editor (thin: every action is an engine command)"
edition.workspace = true
# The engine, capture and compositor crates declare 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

[dependencies]
capturecraft-format = { workspace = true }
capturecraft-engine = { workspace = true }
capturecraft-capture = { workspace = true }
# The wgpu compositor draws the editor canvas into a texture egui shows.
capturecraft-compositor = { workspace = true, features = ["gpu"] }
photocraft-geom = { workspace = true }
# Same UI stack as storytold/photocraft. eframe re-exports egui-wgpu and its
# wgpu, which is the major version the compositor is built against.
photocraft-ui-egui = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde = { workspace = true }
serde_json = { workspace = true }
